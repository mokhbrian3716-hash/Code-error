<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Error</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:tahoma}
body{
background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
color:#fff;
padding:20px;
}
h1,h2,h3{text-align:center;margin-bottom:15px}
input,select,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;
font-size:16px;
}
button{
background:#ff9800;
color:#000;
font-weight:bold;
cursor:pointer;
}
.error-card{
background:#1e293b;
margin:15px 0;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.5);
}
.error-header {
  display: flex;
  justify-content: space-between; /* متن سمت چپ، علامت سمت راست */
  align-items: center;
  padding: 12px 15px;
  cursor: pointer;
  background:#27314d;
  border-radius:15px 15px 0 0;
}

.error-header span:first-child {
  font-size: 18px; /* متن بزرگتر */
  font-weight: bold;
}

.error-header span:last-child {
  font-size: 20px; /* علامت + بزرگتر */
  font-weight: bold;
  transition: transform 0.3s ease, opacity 0.2s ease, color 0.3s ease;
  color: #ff9800;
}

.error-content-inner p {
  font-size: 16px; /* متن کادر بزرگتر */
  line-height: 1.5;
}
.error-content {
  max-height: 0;
  overflow: hidden;

  transition: max-height 0.35s ease, padding 0.35s ease;
  padding: 0 15px;
  background:#1e293b;
  border-radius:10px;
}
.error-content.open {
  max-height: 500px;  /* ارتفاع باز */
  padding: 10px 15px;
}

.error-content-inner {
  transform: none;      /* فقط برای fade */
  opacity: 0;
  transition: opacity 0.35s ease;
}

.error-content.open .error-content-inner {
  opacity: 1;
}
code{
display:block;
background:#0f172a;
padding:10px;
margin:10px 0;
border-radius:8px;
color:#7fff00;
white-space:pre-wrap;
}
.back-button{
background:#00bcd4;
margin-top:15px;
}
.search-box{
background:#0f172a;
color:#fff;
border:1px solid #555;
}
.footer{
text-align:center;
margin-top:20px;
font-size:14px;
color:#ffebcd;
}
.not-found{
text-align:center;
margin-top:20px;
background:#7f1d1d;
padding:15px;
border-radius:12px;
}
.not-found button{
background:#22c55e;
color:#000;
}
.error-header span:last-child {
  display: inline-block;
  transition: transform 0.3s ease, opacity 0.2s ease, color 0.3s ease;
  font-weight: bold;
  color: #ff9800; /* رنگ اولیه */
}
.error-header.open span:last-child {
  color: #ff5252; /* وقتی باز شد */
}
</style>
</head>

<body>

<div id="formSection">
<h1>Codex Error</h1>
<input type="text" id="username" placeholder="اسم شما">
<select id="language">
<option value="">انتخاب زبان</option>
<option value="python">Python</option>
<option value="php">PHP</option>
<option value="js">JavaScript</option>
</select>
<button onclick="start()">نمایش ارورها</button>
<div class="footer">ساخته شده توسط محمدرسول مخبریان با عشق برای همه برنامه نویسان ایران ❤️</div>
</div>

<div id="result"></div>

<script>

function escapeHTML(str){
return str.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

const database = {
  /* ================= PYTHON ================= */
  python:[
    {title:"IndentationError",solution:"این خطا به دلیل رعایت نکردن تورفتگی صحیح در بلاک‌های کد رخ می‌دهد. پایتون وابسته به فاصله است و هر بلاک باید دقیقاً با تعداد فاصله یکسان نوشته شود. استفاده ترکیبی از Tab و Space باعث ایجاد این خطا می‌شود. IDEهایی مثل PyCharm و VSCode گزینه Convert Tabs to Spaces دارند و استفاده از آن کمک می‌کند.",example1:"if True:\nprint('hi')",example2:"if True:\n    print('hi')"},
    {title:"SyntaxError",solution:"این خطا زمانی رخ می‌دهد که ساختار دستوری کد اشتباه باشد. ممکن است پرانتز، کوتیشن یا ':' فراموش شده باشد. خط قبل از خط خطا را هم بررسی کن. استفاده از linters و IDEهای هوشمند باعث کاهش این خطا می‌شود.",example1:"print('hi'",example2:"print('hi')"},
    {title:"NameError",solution:"زمانی رخ می‌دهد که متغیری قبل از تعریف استفاده شده باشد یا اشتباه تایپی در نام متغیر وجود داشته باشد. همیشه قبل از استفاده مقداردهی کن و نام متغیر را دقیق بررسی کن.",example1:"print(x)",example2:"x=5\nprint(x)"},
    {title:"TypeError",solution:"این خطا زمانی رخ می‌دهد که عملیاتی روی نوع داده نامعتبر انجام شود، مثلا جمع عدد و رشته. قبل از انجام عملیات نوع داده‌ها را بررسی کن و در صورت نیاز از تبدیل‌های int(), str(), float() استفاده کن.",example1:"5+'5'",example2:"5+int('5')"},
    {title:"IndexError",solution:"وقتی به اندیسی خارج از محدوده لیست دسترسی پیدا کنی، این خطا رخ می‌دهد. قبل از دسترسی طول لیست را بررسی کن یا از حلقه استفاده کن.",example1:"a=[1]\nprint(a[2])",example2:"print(a[0])"},
    {title:"KeyError",solution:"وقتی کلیدی در دیکشنری وجود ندارد و به آن دسترسی پیدا کنی، KeyError رخ می‌دهد. بهتر است از if key in dict یا dict.get(key) استفاده کنی.",example1:"d={'a':1}\nd['b']",example2:"d.get('b')"},
    {title:"ValueError",solution:"این خطا زمانی رخ می‌دهد که مقدار ورودی نامعتبر باشد. مثلا تبدیل رشته غیرعددی به int. قبل از تبدیل از try/except استفاده کن یا ورودی را بررسی کن.",example1:"int('a')",example2:"int('5')"},
    {title:"ZeroDivisionError",solution:"تقسیم بر صفر تعریف نشده است. قبل از تقسیم بررسی کن مخرج صفر نباشد.",example1:"5/0",example2:"5/1"},
    {title:"ImportError",solution:"این خطا زمانی رخ می‌دهد که ماژول پیدا نشود. مطمئن شو نام ماژول درست است و در صورت نیاز pip install ماژول را نصب کن.",example1:"import abcxyz",example2:"pip install module"},
    {title:"AttributeError",solution:"این خطا وقتی رخ می‌دهد که متد یا ویژگی روی شیء اشتباه فراخوانی شود. مطمئن شو آن متد/ویژگی برای نوع داده موردنظر وجود دارد.",example1:"5.append()",example2:"[5].append(6)"},
    {title:"FileNotFoundError",solution:"وقتی فایلی که می‌خوای باز کنی وجود نداشته باشد این خطا رخ می‌دهد. مسیر فایل را بررسی کن یا قبل از باز کردن وجود آن را کنترل کن.",example1:"open('a.txt')",example2:"open('a.txt','w')"},
    {title:"ModuleNotFoundError",solution:"این خطا وقتی رخ می‌دهد که ماژول نصب نشده باشد. با pip نصب کن یا محیط مجازی فعال کن.",example1:"import flaskkk",example2:"pip install flask"},
    {title:"RuntimeError",solution:"خطایی که در زمان اجرا رخ می‌دهد و معمولاً به شرایط خاص برنامه مرتبط است. بررسی کن که منطق برنامه درست باشد.",example1:"raise RuntimeError()",example2:"بررسی شرط قبل اجرا"},

    {title:"RecursionError",solution:"این خطا زمانی رخ می‌دهد که تابع بازگشتی شرط توقف نداشته باشد و بی‌نهایت اجرا شود. حتماً یک شرط پایان مشخص کن.",example1:"def f():f()",example2:"شرط توقف اضافه کن"},

    {title:"UnboundLocalError",solution:"این خطا زمانی رخ می‌دهد که متغیری محلی قبل از مقداردهی استفاده شود. مطمئن شو مقداردهی قبل از استفاده انجام شده باشد.",example1:"def f():\n print(x)\n x=5",example2:"def f():\n x=5\n print(x)"},
    {title:"AssertionError",solution:"زمانی رخ می‌دهد که شرط assert برقرار نباشد. بررسی کن شرط منطقی درست باشد یا پیام مناسب بده.",example1:"assert 2>3",example2:"assert 3>2"},

function toggleContent(id){
    let el = document.getElementById(id);
    let header = el.previousElementSibling;
    let icon = header.querySelector("span:last-child");

    el.classList.toggle("open");
    header.classList.toggle("open");

    icon.style.transform = "scale(0.5) rotate(180deg)";
    icon.style.opacity = "0";

    setTimeout(()=>{
        icon.textContent = el.classList.contains("open") ? "×" : "+";
        icon.style.transform = "scale(1) rotate(0deg)";
        icon.style.opacity = "1";
    },150);
}

function filterErrors(){
let input=document.getElementById("searchInput").value.toLowerCase();
let found=false;

document.querySelectorAll(".error-card").forEach(card=>{
if(card.innerText.toLowerCase().includes(input)){
card.style.display="block";
found=true;
}else{
card.style.display="none";
}
});

let old=document.getElementById("notFoundBox");
if(old) old.remove();

if(input && !found){
let box=document.createElement("div");
box.className="not-found";
box.id="notFoundBox";
box.innerHTML=`
❌ اروری پیدا نشد
<br><br>
<button onclick="window.open('https://www.google.com/search?q=${input}','_blank')">
جستجو در گوگل
</button>
`;
document.getElementById("result").appendChild(box);
}
}

function start(){
    let name = document.getElementById("username").value;
    let lang = document.getElementById("language").value;
    if(!name || !lang){ alert("همه فیلدها را پر کن"); return; }

    document.getElementById("formSection").style.display = "none";
    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    let html = `<h2>سلام ${name}</h2>
<h3>۱۵ ارور رایج ${lang.toUpperCase()}</h3>
<button class="back-button" onclick="goBack()">بازگشت</button>
<input class="search-box" id="searchInput" onkeyup="filterErrors()" placeholder="جستجو">
`;

    if(!database[lang]){
        resultDiv.innerHTML = "<h2>دیتایی برای این زبان وجود ندارد</h2>";
        return;
    }

    database[lang].forEach((e,i)=>{
        html += `
<div class="error-card">
  <div class="error-header" onclick="toggleContent('c${i}')">
    <span>${e.title}</span>
    <span style="float:right">+</span>
  </div>
  <div class="error-content" id="c${i}">
    <div class="error-content-inner">
      <p>${e.solution}</p>
      <code>❌ ${escapeHTML(e.example1)}</code>
      <code>✅ ${escapeHTML(e.example2)}</code>
    </div>
  </div>
</div>
`;
    });
