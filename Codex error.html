<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Error - راهنمای خطاهای برنامه نویسی</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',tahoma,sans-serif;}

:root{
--bg-primary:#0b1120;
--bg-secondary:#111827;
--bg-card:#1e293b;
--bg-header:#1e293b;
--accent:#f97316;
--accent-hover:#ea580c;
--accent-light:#ffedd5;
--text-primary:#f1f5f9;
--text-secondary:#94a3b8;
--text-muted:#64748b;
--border:#334155;
--success:#10b981;
--danger:#ef4444;
--info:#06b6d4;
--purple:#8b5cf6;
--pink:#ec4899;
--gradient:linear-gradient(135deg,#f97316,#ea580c,#dc2626);
--shadow:0 4px 6px -1px rgba(0,0,0,.3),0 2px 4px -2px rgba(0,0,0,.3);
--shadow-lg:0 10px 15px -3px rgba(0,0,0,.4),0 4px 6px -4px rgba(0,0,0,.4);
--radius:12px;
--radius-lg:20px;
}

body{
background:var(--bg-primary);
color:var(--text-primary);
min-height:100vh;
direction:rtl;
}

/* ===== اسکرول ===== */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--bg-primary);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* ===== هدر ===== */
.site-header{
background:var(--bg-secondary);
border-bottom:1px solid var(--border);
padding:15px 0;
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(10px);
}
.header-inner{
max-width:1200px;
margin:0 auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}
.logo{
display:flex;
align-items:center;
gap:10px;
font-size:24px;
font-weight:900;
background:var(--gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.logo i{font-size:28px;}
.header-actions{display:flex;gap:10px;align-items:center;}
.header-btn{
background:transparent;
border:1px solid var(--border);
color:var(--text-secondary);
padding:8px 16px;
border-radius:var(--radius);
cursor:pointer;
font-size:14px;
transition:all .3s;
width:auto;
margin:0;
}
.header-btn:hover{
border-color:var(--accent);
color:var(--accent);
}

/* ===== فرم ورود ===== */
#formSection{
max-width:500px;
margin:80px auto;
padding:40px;
background:var(--bg-secondary);
border-radius:var(--radius-lg);
border:1px solid var(--border);
box-shadow:var(--shadow-lg);
}
#formSection h1{
font-size:32px;
font-weight:900;
background:var(--gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:5px;
}
.subtitle{
color:var(--text-muted);
text-align:center;
margin-bottom:30px;
font-size:14px;
}
.form-group{margin-bottom:20px;}
.form-group label{
display:block;
margin-bottom:6px;
font-size:13px;
color:var(--text-secondary);
font-weight:500;
}
.form-group input,.form-group select{
width:100%;
padding:14px 16px;
background:var(--bg-primary);
border:1px solid var(--border);
border-radius:var(--radius);
color:var(--text-primary);
font-size:15px;
transition:all .3s;
margin:0;
}
.form-group input:focus,.form-group select:focus{
outline:none;
border-color:var(--accent);
box-shadow:0 0 0 3px rgba(249,115,22,.15);
}
.form-group input::placeholder{color:var(--text-muted);}
.submit-btn{
width:100%;
padding:16px;
background:var(--gradient);
border:none;
border-radius:var(--radius);
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:all .3s;
margin:10px 0 0;
}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(249,115,22,.3);}
.footer-text{
text-align:center;
margin-top:25px;
font-size:13px;
color:var(--text-muted);
}
.footer-text i{color:var(--danger);}

/* ===== محتوای اصلی ===== */
.main-container{
max-width:900px;
margin:0 auto;
padding:20px;
}

/* ===== پروفایل هدر ===== */
.profile-header{
background:var(--bg-secondary);
border-radius:var(--radius-lg);
padding:30px;
border:1px solid var(--border);
margin-bottom:25px;
box-shadow:var(--shadow);
}
.profile-top{
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:15px;
}
.profile-info h2{font-size:24px;font-weight:700;}
.profile-info h2 span{color:var(--accent);}
.profile-info p{color:var(--text-muted);font-size:14px;margin-top:4px;}
.profile-badge{
display:flex;
align-items:center;
gap:8px;
background:rgba(249,115,22,.1);
border:1px solid rgba(249,115,22,.2);
padding:8px 16px;
border-radius:50px;
color:var(--accent);
font-size:13px;
font-weight:500;
}
.profile-badge i{font-size:16px;}

/* ===== آمار ===== */
.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
margin:20px 0;
}
.stat-card{
background:var(--bg-card);
border-radius:var(--radius);
padding:18px;
text-align:center;
border:1px solid var(--border);
transition:all .3s;
}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-card .num{
font-size:28px;
font-weight:900;
background:var(--gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-top:4px;}

/* ===== نوار پیشرفت ===== */
.progress-section{margin:20px 0;}
.progress-label{
display:flex;
justify-content:space-between;
font-size:13px;
color:var(--text-secondary);
margin-bottom:6px;
}
.progress-track{
background:var(--bg-card);
border-radius:50px;
height:8px;
overflow:hidden;
border:1px solid var(--border);
}
.progress-fill{
height:100%;
background:var(--gradient);
border-radius:50px;
transition:width .8s ease;
}

/* ===== دکمه‌های اکشن ===== */
.actions-grid{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:20px 0;
justify-content:center;
}
.action-btn{
padding:10px 20px;
border-radius:var(--radius);
border:1px solid var(--border);
background:var(--bg-card);
color:var(--text-secondary);
cursor:pointer;
font-size:13px;
font-weight:500;
transition:all .3s;
width:auto;
margin:0;
display:inline-flex;
align-items:center;
gap:6px;
}
.action-btn:hover{
border-color:var(--accent);
color:var(--accent);
background:rgba(249,115,22,.05);
transform:translateY(-1px);
}
.action-btn.primary{
background:var(--gradient);
color:#fff;
border:none;
}
.action-btn.primary:hover{box-shadow:0 4px 15px rgba(249,115,22,.3);}
.action-btn.success{color:var(--success);}
.action-btn.success:hover{border-color:var(--success);background:rgba(16,185,129,.05);}
.action-btn.info{color:var(--info);}
.action-btn.info:hover{border-color:var(--info);background:rgba(6,182,212,.05);}
.action-btn.purple{color:var(--purple);}
.action-btn.purple:hover{border-color:var(--purple);background:rgba(139,92,246,.05);}
.action-btn.pink{color:var(--pink);}
.action-btn.pink:hover{border-color:var(--pink);background:rgba(236,72,153,.05);}
.action-btn.warning{color:var(--accent);}
.action-btn.warning:hover{border-color:var(--accent);background:rgba(249,115,22,.05);}

/* ===== جستجو ===== */
.search-wrapper{
position:relative;
margin:20px 0;
}
.search-wrapper i{
position:absolute;
right:16px;
top:50%;
transform:translateY(-50%);
color:var(--text-muted);
font-size:16px;
}
.search-wrapper input{
width:100%;
padding:14px 45px 14px 16px;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:var(--radius);
color:var(--text-primary);
font-size:15px;
transition:all .3s;
margin:0;
}
.search-wrapper input:focus{
outline:none;
border-color:var(--accent);
box-shadow:0 0 0 3px rgba(249,115,22,.1);
}
.search-wrapper input::placeholder{color:var(--text-muted);}

/* ===== کارت ارور ===== */
.error-card{
background:var(--bg-card);
margin:12px 0;
border-radius:var(--radius);
overflow:hidden;
border:1px solid var(--border);
transition:all .3s;
}
.error-card:hover{border-color:rgba(249,115,22,.3);}
.error-card.bookmarked{
border-right:4px solid var(--accent);
}
.error-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 20px;
cursor:pointer;
background:var(--bg-header);
transition:all .3s;
user-select:none;
}
.error-header:hover{background:rgba(249,115,22,.05);}
.error-header .title{
font-size:16px;
font-weight:700;
display:flex;
align-items:center;
gap:8px;
}
.error-header .title .bookmark-icon{color:var(--accent);}
.error-header .icon{
font-size:18px;
font-weight:700;
color:var(--accent);
transition:all .3s;
display:flex;
align-items:center;
justify-content:center;
width:28px;
height:28px;
border-radius:50%;
background:rgba(249,115,22,.1);
}
.error-header.open .icon{
color:var(--danger);
background:rgba(239,68,68,.1);
transform:rotate(45deg);
}
.error-content{
max-height:0;
overflow:hidden;
transition:max-height .4s ease,padding .4s ease;
padding:0 20px;
background:var(--bg-card);
}
.error-content.open{
max-height:600px;
padding:16px 20px;
}
.error-content-inner{opacity:0;transition:opacity .4s ease;}
.error-content.open .error-content-inner{opacity:1;}
.error-content p{
font-size:14px;
line-height:1.8;
color:var(--text-secondary);
margin-bottom:12px;
}
.code-block{
background:var(--bg-primary);
border-radius:8px;
padding:12px 16px;
margin:8px 0;
border:1px solid var(--border);
position:relative;
}
.code-block .code-label{
font-size:11px;
color:var(--text-muted);
margin-bottom:6px;
display:flex;
align-items:center;
gap:6px;
}
.code-block .code-label .badge{
padding:2px 8px;
border-radius:4px;
font-size:10px;
font-weight:700;
}
.code-block .code-label .badge.danger{background:rgba(239,68,68,.15);color:var(--danger);}
.code-block .code-label .badge.success{background:rgba(16,185,129,.15);color:var(--success);}
.code-block code{
display:block;
color:#7fff00;
font-family:'Courier New',monospace;
font-size:13px;
white-space:pre-wrap;
direction:ltr;
text-align:left;
}
.code-actions{
display:flex;
gap:6px;
margin-top:8px;
flex-wrap:wrap;
}
.code-actions button{
padding:6px 12px;
border-radius:6px;
border:1px solid var(--border);
background:transparent;
color:var(--text-muted);
cursor:pointer;
font-size:12px;
transition:all .3s;
width:auto;
margin:0;
}
.code-actions button:hover{
border-color:var(--accent);
color:var(--accent);
background:rgba(249,115,22,.05);
}
.code-actions button.copy-main{
background:var(--success);
color:#fff;
border:none;
}
.code-actions button.copy-main:hover{background:#059669;}

/* ===== بوکمارک ===== */
.empty-state{
text-align:center;
padding:60px 20px;
color:var(--text-muted);
}
.empty-state i{font-size:48px;margin-bottom:15px;color:var(--border);}
.empty-state p{font-size:16px;}

/* ===== مقایسه ===== */
.compare-container{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:20px;
}
.compare-card{
background:var(--bg-card);
border-radius:var(--radius);
padding:20px;
border:1px solid var(--border);
}
.compare-card h3{
font-size:16px;
font-weight:700;
margin-bottom:10px;
display:flex;
align-items:center;
gap:8px;
}
.compare-card p{font-size:13px;color:var(--text-secondary);line-height:1.7;}

/* ===== نوتیف ===== */
.toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%) translateY(100px);
background:var(--bg-card);
border:1px solid var(--border);
color:var(--text-primary);
padding:14px 28px;
border-radius:var(--radius);
font-weight:500;
font-size:14px;
opacity:0;
transition:all .4s ease;
z-index:9999;
box-shadow:var(--shadow-lg);
display:flex;
align-items:center;
gap:10px;
}
.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}
.toast i{font-size:18px;}

/* ===== فوتر ===== */
.site-footer{
text-align:center;
padding:30px 20px;
border-top:1px solid var(--border);
margin-top:40px;
color:var(--text-muted);
font-size:13px;
}
.site-footer i{color:var(--danger);}
.site-footer .name{color:var(--accent);font-weight:700;}

/* ===== ریسپانسیو ===== */
@media(max-width:768px){
#formSection{margin:40px 20px;padding:25px;}
.profile-top{flex-direction:column;text-align:center;}
.stats-grid{grid-template-columns:repeat(2,1fr);}
.actions-grid{gap:6px;}
.action-btn{font-size:12px;padding:8px 14px;}
.compare-container{grid-template-columns:1fr;}
.header-inner{flex-direction:column;gap:10px;}
.header-actions{flex-wrap:wrap;justify-content:center;}
}
</style>
</head>
<body>

<!-- ===== هدر ===== -->
<header class="site-header">
<div class="header-inner">
<div class="logo">
<i class="fas fa-bug"></i>
Codex Error
</div>
<div class="header-actions">
<button class="header-btn" onclick="location.reload()"><i class="fas fa-home"></i> صفحه اصلی</button>
</div>
</div>
</header>

<!-- ===== فرم ورود ===== -->
<div id="formSection">
<h1>🚀 Codex Error</h1>
<p class="subtitle">راهنمای جامع خطاهای برنامه نویسی</p>

<div class="form-group">
<label><i class="fas fa-user"></i> نام شما</label>
<input type="text" id="username" placeholder="مثلاً: علی">
</div>

<div class="form-group">
<label><i class="fas fa-code"></i> زبان برنامه نویسی</label>
<select id="language">
<option value="">انتخاب کنید...</option>
<option value="python">Python</option>
<option value="php">PHP</option>
<option value="js">JavaScript</option>
<option value="c">C</option>
<option value="cpp">C++</option>
</select>
</div>

<button class="submit-btn" onclick="start()">
<i class="fas fa-rocket"></i> شروع کن!
</button>

<div class="footer-text">
ساخته شده با <i class="fas fa-heart"></i> توسط محمدرسول مخبریان
</div>
</div>

<!-- ===== محتوا ===== -->
<div id="result"></div>

<!-- ===== نوتیف ===== -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span></span></div>

<!-- ===== فوتر ===== -->
<div class="site-footer">
ساخته شده با <i class="fas fa-heart"></i> توسط <span class="name">محمدرسول مخبریان</span> برای همه برنامه‌نویسان ایران
</div>

<script>
function escapeHTML(str){
return str.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');
}

function showToast(msg,icon='✅'){
let t=document.getElementById('toast');
t.querySelector('i').className=`fas ${icon==='✅'?'fa-check-circle':icon==='❌'?'fa-times-circle':'fa-info-circle'}`;
t.querySelector('span').textContent=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2500);
}

function copyCode(el){
let code=el.closest('.code-block').querySelector('code').textContent;
navigator.clipboard.writeText(code).then(()=>{
showToast('کپی شد!','✅');
});
}

function toggleDarkMode(){
document.body.classList.toggle('dark-mode');
let btn=document.querySelector('.dark-mode-btn');
if(btn){
btn.innerHTML=document.body.classList.contains('dark-mode')?'<i class="fas fa-sun"></i> حالت روشن':'<i class="fas fa-moon"></i> حالت تاریک';
}
localStorage.setItem('darkMode',document.body.classList.contains('dark-mode'));
}

function showRandomError(){
let lang=document.getElementById('language').value;
if(!lang||!database[lang]){showToast('اول زبان رو انتخاب کن','❌');return;}
let errors=database[lang];
let rand=errors[Math.floor(Math.random()*errors.length)];
showToast(`🎲 ${rand.title}`,'🎲');
}

// ===== بوکمارک =====
let bookmarks=JSON.parse(localStorage.getItem('codexBookmarks')||'[]');

function toggleBookmark(lang,index){
let key=lang+'_'+index;
if(bookmarks.includes(key)){
bookmarks=bookmarks.filter(b=>b!==key);
showToast('از بوکمارک حذف شد','❌');
}else{
bookmarks.push(key);
showToast('به بوکمارک اضافه شد','⭐');
}
localStorage.setItem('codexBookmarks',JSON.stringify(bookmarks));
renderBookmarkBtn();
start();
}

function renderBookmarkBtn(){
let btn=document.getElementById('showBookmarksBtn');
if(!btn)return;
let count=bookmarks.length;
btn.innerHTML=count>0?`<i class="fas fa-bookmark"></i> بوکمارک‌ها (${count})`:'<i class="fas fa-bookmark"></i> بوکمارک‌ها';
}

function showBookmarks(){
let lang=document.getElementById('language').value;
if(!lang||!database[lang]){showToast('اول زبان رو انتخاب کن','❌');return;}
let resultDiv=document.getElementById('result');
let html=`
<div class="main-container">
<div class="profile-header">
<div class="profile-top">
<div class="profile-info">
<h2>⭐ بوکمارک‌های شما</h2>
<p>ارورهایی که ذخیره کردی</p>
</div>
<div class="profile-badge"><i class="fas fa-bookmark"></i> ${bookmarks.length} مورد</div>
</div>
</div>
<div style="text-align:center;margin:10px 0;">
<button class="action-btn danger" onclick="clearBookmarks()" style="color:var(--danger);"><i class="fas fa-trash"></i> پاک کردن همه</button>
<button class="action-btn primary" onclick="start()"><i class="fas fa-arrow-right"></i> بازگشت</button>
</div>`;
let count=0;
database[lang].forEach((e,i)=>{
let key=lang+'_'+i;
if(bookmarks.includes(key)){
count++;
html+=`
<div class="error-card bookmarked">
<div class="error-header" onclick="toggleContent('bm${i}')">
<div class="title"><i class="fas fa-bookmark bookmark-icon"></i> ${e.title}</div>
<div class="icon">+</div>
</div>
<div class="error-content" id="bm${i}">
<div class="error-content-inner">
<p>${e.solution}</p>
<div class="code-actions">
<button onclick="toggleBookmark('${lang}',${i})"><i class="fas fa-bookmark"></i> حذف بوکمارک</button>
</div>
<div class="code-block">
<div class="code-label"><span class="badge danger">❌ اشتباه</span></div>
<code>${escapeHTML(e.example1)}</code>
</div>
<div class="code-block">
<div class="code-label"><span class="badge success">✅ درست</span></div>
<code>${escapeHTML(e.example2)}</code>
</div>
</div>
</div>
</div>`;
}
});
if(count===0)html+=`<div class="empty-state"><i class="fas fa-bookmark"></i><p>هنوز بوکمارکی نداری 😢</p></div>`;
html+=`</div>`;
resultDiv.innerHTML=html;
}

function clearBookmarks(){
bookmarks=[];
localStorage.setItem('codexBookmarks','[]');
showToast('همه بوکمارک‌ها پاک شد','🗑️');
showBookmarks();
}

// ===== باز کردن همه =====
let allOpen=false;
function toggleAll(){
allOpen=!allOpen;
document.querySelectorAll('.error-content').forEach(el=>{
el.classList.toggle('open',allOpen);
});
document.querySelectorAll('.error-header').forEach(el=>{
el.classList.toggle('open',allOpen);
let icon=el.querySelector('.icon');
icon.textContent=allOpen?'×':'+';
});
let btn=document.querySelector('.expand-all-btn');
btn.innerHTML=allOpen?'<i class="fas fa-compress"></i> بستن همه':'<i class="fas fa-expand"></i> باز کردن همه';
}

// ===== خروجی =====
function exportData(){
let lang=document.getElementById('language').value;
if(!lang||!database[lang]){showToast('اول زبان رو انتخاب کن','❌');return;}
let data=JSON.stringify(database[lang],null,2);
let blob=new Blob([data],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=`codex_${lang}.json`;
a.click();
showToast('فایل دانلود شد','📥');
}

// ===== مقایسه =====
function compareErrors(){
let lang=document.getElementById('language').value;
if(!lang||!database[lang]){showToast('اول زبان رو انتخاب کن','❌');return;}
let errors=database[lang];
let rand1=errors[Math.floor(Math.random()*errors.length)];
let rand2=errors[Math.floor(Math.random()*errors.length)];
while(rand2===rand1)rand2=errors[Math.floor(Math.random()*errors.length)];
showToast(`📊 ${rand1.title} vs ${rand2.title}`,'📊');
let resultDiv=document.getElementById('result');
let html=`
<div class="main-container">
<div class="profile-header">
<div class="profile-top">
<div class="profile-info">
<h2>📊 مقایسه دو ارور</h2>
<p>مقایسه تصادفی</p>
</div>
</div>
</div>
<div class="compare-container">
<div class="compare-card">
<h3 style="color:var(--accent);"><i class="fas fa-bug"></i> ${rand1.title}</h3>
<p>${rand1.solution}</p>
<div class="code-block">
<div class="code-label"><span class="badge danger">❌</span></div>
<code>${escapeHTML(rand1.example1)}</code>
</div>
<div class="code-block">
<div class="code-label"><span class="badge success">✅</span></div>
<code>${escapeHTML(rand1.example2)}</code>
</div>
</div>
<div class="compare-card">
<h3 style="color:var(--info);"><i class="fas fa-bug"></i> ${rand2.title}</h3>
<p>${rand2.solution}</p>
<div class="code-block">
<div class="code-label"><span class="badge danger">❌</span></div>
<code>${escapeHTML(rand2.example1)}</code>
</div>
<div class="code-block">
<div class="code-label"><span class="badge success">✅</span></div>
<code>${escapeHTML(rand2.example2)}</code>
</div>
</div>
</div>
<div style="text-align:center;margin-top:16px;">
<button class="action-btn primary" onclick="compareErrors()"><i class="fas fa-random"></i> مقایسه دوباره</button>
<button class="action-btn" onclick="start()"><i class="fas fa-arrow-right"></i> بازگشت</button>
</div>
</div>`;
resultDiv.innerHTML=html;
}

// ===== اشتراک‌گذاری =====
function shareErrors(){
let lang=document.getElementById('language').value;
if(!lang||!database[lang]){showToast('اول زبان رو انتخاب کن','❌');return;}
let text=`🚀 Codex Error - ${lang.toUpperCase()}\n`;
text+=`📚 ${database[lang].length} ارور رایج\n\n`;
database[lang].slice(0,5).forEach(e=>{
text+=`🔹 ${e.title}\n`;
});
text+=`\n❤️ ساخته شده توسط محمدرسول مخبریان`;
if(navigator.share){
navigator.share({title:'Codex Error',text:text}).catch(()=>{});
}else{
navigator.clipboard.writeText(text).then(()=>{
showToast('متن کپی شد! میتونی بفرستی','📤');
});
}
}

function toggleContent(id){
    let el = document.getElementById(id);
    let header = el.previousElementSibling;
    let icon = header.querySelector('.icon');

    el.classList.toggle("open");
    header.classList.toggle("open");

    icon.style.transform = "scale(0.5) rotate(180deg)";
    icon.style.opacity = "0";

    setTimeout(()=>{
        icon.textContent = el.classList.contains("open") ? "×" : "+";
        icon.style.transform = "scale(1) rotate(0deg)";
        icon.style.opacity = "1";
    },150);
}

function filterErrors(){
    let input = document.getElementById("searchInput").value.toLowerCase();
    let lang = document.getElementById("language").value;
    let found = false;

    document.querySelectorAll(".error-card").forEach(card=>{
        if(card.innerText.toLowerCase().includes(input)){
            card.style.display="block";
            found = true;
        } else {
            card.style.display="none";
        }
    });

    let old = document.getElementById("notFoundBox");
    if(old) old.remove();

    if(input && !found){
        let box = document.createElement("div");
        box.className = "empty-state";
        box.id = "notFoundBox";
        box.innerHTML = `
<i class="fas fa-search"></i>
<p>اروری پیدا نشد</p>
<br>
<button class="action-btn primary" onclick="window.open('https://www.google.com/search?q=ارور+${encodeURIComponent(input)}+ زبان برنامه نویسی برای+${encodeURIComponent(lang)}','_blank')">
<i class="fas fa-search"></i> جستجو در گوگل
</button>
`;
        document.getElementById("result").querySelector('.main-container').appendChild(box);
    }
}

function start(){
    let name = document.getElementById("username").value;
    let lang = document.getElementById("language").value;
    if(!name || !lang){ showToast("همه فیلدها رو پر کن",'❌'); return; }

    document.getElementById("formSection").style.display = "none";
    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    let total = database[lang] ? database[lang].length : 0;
    let bookmarkedCount = bookmarks.filter(b=>b.startsWith(lang)).length;

    let html = `

<div class="profile-header">
<div class="profile-top">
<div class="profile-info">
<h2>سلام <span>${name}</span> 👋</h2>
<p>${total} ارور رایج ${lang.toUpperCase()} رو برات آماده کردم</p>
</div>
<div class="profile-badge"><i class="fas fa-code"></i> ${lang.toUpperCase()}</div>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="num">${total}</div><div class="label">تعداد ارورها</div></div>
<div class="stat-card"><div class="num">${bookmarkedCount}</div><div class="label">بوکمارک شده</div></div>
<div class="stat-card"><div class="num">${Math.round(bookmarkedCount/total*100)||0}%</div><div class="label">پیشرفت</div></div>
</div>

<div class="progress-section">
<div class="progress-label">
<span><i class="fas fa-bookmark"></i> پیشرفت بوکمارک</span>
<span>${bookmarkedCount}/${total}</span>
</div>
<div class="progress-track">
<div class="progress-fill" style="width:${(bookmarkedCount/total*100)||0}%"></div>
</div>
</div>
</div>

<div class="actions-grid">
<button class="action-btn primary" onclick="showRandomError()"><i class="fas fa-dice"></i> تصادفی</button>
<button class="action-btn info" onclick="toggleAll()"><i class="fas fa-expand"></i> باز کردن همه</button>
<button class="action-btn success" onclick="exportData()"><i class="fas fa-download"></i> خروجی</button>
<button class="action-btn purple" onclick="compareErrors()"><i class="fas fa-not-equal"></i> مقایسه</button>
<button class="action-btn pink" onclick="shareErrors()"><i class="fas fa-share-alt"></i> اشتراک</button>
<button class="action-btn warning" id="showBookmarksBtn" onclick="showBookmarks()"><i class="fas fa-bookmark"></i> بوکمارک‌ها (${bookmarks.length})</button>
</div>

<div class="search-wrapper">
<i class="fas fa-search"></i>
<input class="search-box" id="searchInput" onkeyup="filterErrors()" placeholder="جستجوی ارور...">
</div>
`;

    if(!database[lang]){
        resultDiv.innerHTML = "<h2>دیتایی برای این زبان وجود ندارد</h2>";
        return;
    }

    database[lang].forEach((e,i)=>{
        let isBookmarked=bookmarks.includes(lang+'_'+i);
        html += `
<div class="error-card ${isBookmarked?'bookmarked':''}">
<div class="error-header" onclick="toggleContent('c${i}')">
<div class="title">${isBookmarked?'<i class="fas fa-bookmark bookmark-icon"></i>':''} ${e.title}</div>
<div class="icon">+</div>
</div>
<div class="error-content" id="c${i}">
<div class="error-content-inner">
<p>${e.solution}</p>
<div class="code-actions">
<button onclick="toggleBookmark('${lang}',${i})"><i class="fas ${isBookmarked?'fa-bookmark':'fa-bookmark'}"></i> ${isBookmarked?'حذف بوکمارک':'بوکمارک'}</button>
</div>
<div class="code-block">
<div class="code-label"><span class="badge danger">❌ اشتباه</span> <span style="margin-right:auto;font-size:11px;color:var(--text-muted);">مثال</span></div>
<code>${escapeHTML(e.example1)}</code>
<div class="code-actions"><button class="copy-main" onclick="copyCode(this)"><i class="fas fa-copy"></i> کپی</button></div>
</div>
<div class="code-block">
<div class="code-label"><span class="badge success">✅ درست</span> <span style="margin-right:auto;font-size:11px;color:var(--text-muted);">مثال</span></div>
<code>${escapeHTML(e.example2)}</code>
<div class="code-actions"><button class="copy-main" onclick="copyCode(this)"><i class="fas fa-copy"></i> کپی</button></div>
</div>
</div>
</div>
</div>`;
    });

    html += `</div>`;
    resultDiv.innerHTML = html;

    if(localStorage.getItem('darkMode')==='true'){
        document.body.classList.add('dark-mode');
    }
}
</script>
</body>
</html>
